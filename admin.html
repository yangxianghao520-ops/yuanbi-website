<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0A2A5E">
  <title>后台管理 - 重庆圆皕齿轮</title>
  <meta name="description" content="圆皕齿轮官网后台管理系统">
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a href="#admin-app" class="skip-link">跳转到管理后台</a>
  <div id="admin-login" class="admin-login" role="dialog" aria-modal="true" aria-labelledby="login-title">
    <div class="admin-login-card">
      <div style="text-align:center;margin-bottom:24px;">
        <div style="width:56px;height:56px;background:linear-gradient(135deg,var(--color-primary),var(--color-primary-light));border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-display);font-size:1.5rem;font-weight:700;">YB</div>
      </div>
      <h2 id="login-title">后台管理</h2>
      <p class="subtitle">请输入管理员密码以访问询价记录</p>
      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="password">管理员密码</label>
          <input type="password" id="password" name="password" class="form-input" placeholder="请输入密码" autofocus autocomplete="current-password">
          <div class="form-error-msg" id="login-error"></div>
        </div>
        <button type="submit" id="login-btn" class="btn btn-primary" style="width:100%;padding:14px;">登录</button>
      </form>
      <p style="text-align:center;font-size:0.8125rem;color:var(--color-gray-500);margin-top:20px;">请确保本地服务器已启动（node server.js）</p>
    </div>
  </div>
  <div id="admin-app" style="display:none;">
    <header class="admin-header">
      <div class="admin-header-inner">
        <div style="display:flex;align-items:center;gap:12px;">
          <div style="width:32px;height:32px;background:rgba(255,255,255,0.15);border-radius:4px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;">YB</div>
          <h1>圆皕齿轮 · 询价管理后台</h1>
        </div>
        <div style="display:flex;align-items:center;gap:16px;">
          <a href="index.html" style="color:rgba(255,255,255,0.8);font-size:0.875rem;">返回官网</a>
          <button id="logout-btn" class="btn btn-sm btn-outline">退出登录</button>
        </div>
      </div>
    </header>
    <div class="admin-main">
      <div class="admin-stats">
        <div class="admin-stat-card"><div class="admin-stat-number" id="stat-total">0</div><div class="admin-stat-label">累计询价条数</div></div>
        <div class="admin-stat-card"><div class="admin-stat-number" id="stat-today">0</div><div class="admin-stat-label">今日新增询价</div></div>
        <div class="admin-stat-card"><div class="admin-stat-number" id="stat-types">0</div><div class="admin-stat-label">需求类型数</div></div>
      </div>
      <div class="admin-toolbar">
        <input type="text" id="admin-search" class="admin-search" placeholder="搜索公司名称、联系人、电话、需求类型...">
        <div style="display:flex;gap:10px;">
          <button id="refresh-btn" class="btn btn-outline-dark btn-sm">刷新数据</button>
          <button id="export-csv-btn" class="btn btn-outline-dark btn-sm">导出 CSV</button>
          <button id="export-btn" class="btn btn-primary btn-sm">导出 JSON</button>
        </div>
      </div>
      <div style="overflow-x:auto;background:#fff;border-radius:var(--radius-md);box-shadow:var(--shadow-sm);">
        <table class="admin-table" style="min-width:900px;">
          <thead><tr><th>提交时间</th><th>公司名称</th><th>联系人</th><th>联系电话</th><th>需求类型</th><th>需求详情</th><th>操作</th></tr></thead>
          <tbody id="inquiry-tbody"><tr><td colspan="7" style="text-align:center;padding:40px;color:var(--color-gray-500);">加载中...</td></tr></tbody>
        </table>
      </div>
      <p style="text-align:center;font-size:0.8125rem;color:var(--color-gray-500);margin-top:24px;">数据存储于服务器本地文件 data/inquiries.json，重启服务器不丢失。</p>
    </div>
  </div>
  <div id="detail-modal" class="modal-overlay" role="dialog" aria-modal="true">
    <div class="modal-dialog" style="max-width:600px;text-align:left;">
      <h3 style="margin-bottom:20px;">询价详情</h3>
      <div id="detail-content" style="font-size:0.9375rem;line-height:2;color:var(--color-gray-700);"></div>
      <div style="margin-top:24px;text-align:center;display:flex;gap:12px;justify-content:center;">
        <button id="detail-close" class="btn btn-outline-dark">关闭</button>
        <button id="detail-delete" class="btn" style="background:#DC2626;color:#fff;">删除此条</button>
      </div>
    </div>
  </div>
  <script>
  (function() {
    'use strict';
    var TOKEN_KEY = 'yuanbi_admin_token';
    var currentData = [];
    var currentDetailId = null;
    var loginSection = document.getElementById('admin-login');
    var adminApp = document.getElementById('admin-app');
    var loginForm = document.getElementById('login-form');
    var loginError = document.getElementById('login-error');
    var loginBtn = document.getElementById('login-btn');
    var logoutBtn = document.getElementById('logout-btn');
    var searchInput = document.getElementById('admin-search');
    var refreshBtn = document.getElementById('refresh-btn');
    var exportBtn = document.getElementById('export-btn');
    var exportCsvBtn = document.getElementById('export-csv-btn');
    var tbody = document.getElementById('inquiry-tbody');
    var detailModal = document.getElementById('detail-modal');
    var detailContent = document.getElementById('detail-content');
    var detailClose = document.getElementById('detail-close');
    var detailDelete = document.getElementById('detail-delete');
    function getToken() { return sessionStorage.getItem(TOKEN_KEY); }
    function setToken(t) { sessionStorage.setItem(TOKEN_KEY, t); }
    function clearToken() { sessionStorage.removeItem(TOKEN_KEY); }
    function showLogin() { loginSection.style.display = 'flex'; adminApp.style.display = 'none'; }
    function showAdmin() { loginSection.style.display = 'none'; adminApp.style.display = 'block'; loadData(); }
    function escapeHtml(str) { var div = document.createElement('div'); div.textContent = str || ''; return div.innerHTML; }
    function formatDate(iso) { var d = new Date(iso); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
    loginForm.addEventListener('submit', function(e) {
      e.preventDefault();
      var password = document.getElementById('password').value;
      loginError.classList.remove('show');
      loginBtn.disabled = true;
      loginBtn.textContent = '登录中...';
      fetch('/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: password }) })
      .then(function(res) { return res.json(); })
      .then(function(data) { if (data.success) { setToken(data.token); showAdmin(); } else { loginError.textContent = data.message || '密码错误'; loginError.classList.add('show'); } })
      .catch(function() { loginError.textContent = '无法连接服务器，请确保已运行 node server.js'; loginError.classList.add('show'); })
      .finally(function() { loginBtn.disabled = false; loginBtn.textContent = '登录'; });
    });
    logoutBtn.addEventListener('click', function() { clearToken(); showLogin(); document.getElementById('password').value = ''; });
    function loadData() {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--color-gray-500);">加载中...</td></tr>';
      fetch('/api/inquiries', { headers: { 'Authorization': 'Bearer ' + getToken() } })
      .then(function(res) { if (res.status === 401) { clearToken(); showLogin(); return null; } return res.json(); })
      .then(function(data) { if (!data) return; currentData = data.data || []; renderStats(currentData); renderTable(currentData); })
      .catch(function() { tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:40px;color:#DC2626;">加载失败，请检查服务器是否运行</td></tr>'; });
    }
    function renderStats(list) {
      document.getElementById('stat-total').textContent = list.length;
      var today = new Date().toDateString();
      var todayCount = list.filter(function(i) { return new Date(i.createdAt).toDateString() === today; }).length;
      document.getElementById('stat-today').textContent = todayCount;
      var types = {};
      list.forEach(function(i) { types[i.productType] = true; });
      document.getElementById('stat-types').textContent = Object.keys(types).length;
    }
    function renderTable(list) {
      if (!list.length) { tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--color-gray-500);">暂无询价记录</td></tr>'; return; }
      tbody.innerHTML = list.map(function(item) {
        return '<tr>' +
          '<td>' + formatDate(item.createdAt) + '</td>' +
          '<td>' + escapeHtml(item.company) + '</td>' +
          '<td>' + escapeHtml(item.contact) + '</td>' +
          '<td>' + escapeHtml(item.phone) + '</td>' +
          '<td>' + escapeHtml(item.productType) + '</td>' +
          '<td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + escapeHtml(item.description) + '">' + escapeHtml(item.description) + '</td>' +
          '<td><button class="btn btn-sm btn-outline-dark view-detail" data-id="' + item.id + '">查看</button></td>' +
          '</tr>';
      }).join('');
      tbody.querySelectorAll('.view-detail').forEach(function(btn) {
        btn.addEventListener('click', function() { showDetail(parseInt(btn.dataset.id)); });
      });
    }
    function showDetail(id) {
      var item = currentData.find(function(x) { return x.id === id; });
      if (!item) return;
      currentDetailId = id;
      detailContent.innerHTML =
        '<p><strong>提交时间：</strong>' + formatDate(item.createdAt) + '</p>' +
        '<p><strong>公司名称：</strong>' + escapeHtml(item.company) + '</p>' +
        '<p><strong>联系人：</strong>' + escapeHtml(item.contact) + '</p>' +
        '<p><strong>联系电话：</strong>' + escapeHtml(item.phone) + '</p>' +
        '<p><strong>电子邮箱：</strong>' + escapeHtml(item.email || '-') + '</p>' +
        '<p><strong>需求类型：</strong>' + escapeHtml(item.productType) + '</p>' +
        '<p><strong>需求详情：</strong><br>' + escapeHtml(item.description).replace(/\n/g, '<br>') + '</p>';
      detailModal.classList.add('show');
      document.body.style.overflow = 'hidden';
    }
    detailClose.addEventListener('click', function() { detailModal.classList.remove('show'); document.body.style.overflow = ''; });
    detailModal.addEventListener('click', function(e) { if (e.target === detailModal) { detailModal.classList.remove('show'); document.body.style.overflow = ''; } });
    detailDelete.addEventListener('click', function() {
      if (!currentDetailId) return;
      if (!confirm('确定要删除这条询价记录吗？删除后不可恢复。')) return;
      fetch('/api/inquiry/' + currentDetailId, { method: 'DELETE', headers: { 'Authorization': 'Bearer ' + getToken() } })
      .then(function(res) { return res.json(); })
      .then(function(data) { if (data.success) { detailModal.classList.remove('show'); document.body.style.overflow = ''; loadData(); } else { alert('删除失败：' + data.message); } })
      .catch(function() { alert('删除失败，请检查服务器'); });
    });
    searchInput.addEventListener('input', function() {
      var kw = searchInput.value.trim().toLowerCase();
      if (!kw) { renderTable(currentData); return; }
      var filtered = currentData.filter(function(item) {
        return (item.company || '').toLowerCase().indexOf(kw) > -1 ||
          (item.contact || '').toLowerCase().indexOf(kw) > -1 ||
          (item.phone || '').toLowerCase().indexOf(kw) > -1 ||
          (item.productType || '').toLowerCase().indexOf(kw) > -1 ||
          (item.description || '').toLowerCase().indexOf(kw) > -1;
      });
      renderTable(filtered);
    });
    refreshBtn.addEventListener('click', loadData);
    exportBtn.addEventListener('click', function() {
      if (!currentData.length) { alert('暂无数据可导出'); return; }
      var blob = new Blob([JSON.stringify(currentData, null, 2)], { type: 'application/json' });
      downloadFile(blob, 'yuanbi_inquiries_' + getDateStr() + '.json');
    });
    exportCsvBtn.addEventListener('click', function() {
      if (!currentData.length) { alert('暂无数据可导出'); return; }
      var headers = ['提交时间', '公司名称', '联系人', '联系电话', '电子邮箱', '需求类型', '需求详情'];
      var rows = currentData.map(function(item) { return [formatDate(item.createdAt), item.company, item.contact, item.phone, item.email || '', item.productType, item.description]; });
      var csv = '\uFEFF' + [headers].concat(rows).map(function(row) {
        return row.map(function(cell) { cell = String(cell || '').replace(/"/g, '""'); return '"' + cell + '"'; }).join(',');
      }).join('\n');
      var blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
      downloadFile(blob, 'yuanbi_inquiries_' + getDateStr() + '.csv');
    });
    function downloadFile(blob, filename) {
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
    function getDateStr() {
      var d = new Date();
      return d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0') + '_' + String(d.getHours()).padStart(2, '0') + String(d.getMinutes()).padStart(2, '0');
    }
    document.addEventListener('keydown', function(e) { if (e.key === 'Escape' && detailModal.classList.contains('show')) { detailModal.classList.remove('show'); document.body.style.overflow = ''; } });
    if (getToken()) { showAdmin(); } else { showLogin(); }
  })();
  </script>
  <noscript><div style="padding:16px;background:#FFF3CD;color:#856404;text-align:center;">您的浏览器已禁用 JavaScript，后台管理功能无法使用。请启用 JavaScript 后刷新页面。</div></noscript>
</body>
</html>
